name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: erp/backend/requirements/dev.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Lint (flake8)
        run: flake8 apps config
      - name: Format check (black + isort)
        run: |
          black --check apps config
          isort --check-only apps config
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run --noinput
      - name: Test (SQLite)
        run: python manage.py test --settings=config.settings.test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: erp/frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
