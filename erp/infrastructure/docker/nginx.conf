# SLZ ERP — hardened nginx configuration for production SPA + API proxy.
# Serves the Vite-built frontend from /usr/share/nginx/html and proxies
# /api/ and health probes to the backend gunicorn service.
#
# This file is included from the http context (conf.d), so http-only
# directives (limit_req_zone) must live OUTSIDE the server block below.

# ------------------------------------------------------------------
# Rate limiting — protects auth/API endpoints before they reach Django
# ------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

# ------------------------------------------------------------------
# Forwarded protocol — preserve the scheme Cloudflare reported.
# In production the Cloudflare Tunnel connector fronts nginx over plain
# HTTP but always sends X-Forwarded-Proto: https, and Django's
# SECURE_SSL_REDIRECT relies on it. Overwriting it with $scheme here
# would cause a redirect loop. Fall back to $scheme for direct (non-CF)
# requests so plain-HTTP clients are still redirected correctly.
# ------------------------------------------------------------------
map $http_x_forwarded_proto $slz_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Gzip compression — significantly reduces SPA bundle transfer size
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: default-src 'self' allows SPA assets and API calls to same origin.
    # style-src 'unsafe-inline' is needed because Vite inlines critical CSS.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    # Strip server version from error pages.
    server_tokens off;

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slz_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ------------------------------------------------------------------
    # API proxy
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $slz_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Health / readiness probes — no rate limit, short timeout.
    location ~ ^/(health|ready)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    # ------------------------------------------------------------------
    # SPA fallback — all non-file, non-api requests serve index.html
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        # Cache static assets aggressively (they have content hashes in filenames).
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Deny access to hidden files.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}